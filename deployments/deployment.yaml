apiVersion: apps/v1
kind: Deployment
metadata:
  name:  my-deployment
  labels:
    name:  my-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      name:  my-pod
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        name:  my-pod
    spec:
      containers:
      - name: my-container
        image: nginx:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 80